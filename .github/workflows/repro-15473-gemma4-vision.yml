name: repro-15473-gemma4-vision

# Reproduce unslothai/unsloth#15473 on GitHub-hosted Apple Silicon (M1-class) runners:
# Gemma 4 answering an image prompt with <unused6226> when MLX runs it in float16.
# "prefix" is unsloth-zoo just before unslothai/unsloth-zoo#2146 (the fp32 pooler fix), "main" is current.
on:
  push:
    branches: [repro/15473-gemma4-e4b-m1]
    paths:
      - .github/workflows/repro-15473-gemma4-vision.yml
      - .github/repro/*.py
  workflow_dispatch:
    inputs:
      model:
        description: MLX checkpoint for the end-to-end job
        default: mlx-community/gemma-4-e4b-it-4bit

permissions:
  contents: read

env:
  PREFIX_REF: a8eb7f652f224d2dd06f5956d3c838a7c6f8c772
  # The hosted VM's paravirtual GPU can time out one large command buffer; smaller buffers change only scheduling.
  MLX_MAX_OPS_PER_BUFFER: '10'
  MLX_MAX_MB_PER_BUFFER: '256'

jobs:
  # 26B's vision tower and projection only (the full checkpoint does not fit a 7 GB runner):
  # the overflow lives there, so pre-fix must produce non-finite soft tokens and main must not.
  tower-26b:
    name: tower-26b / ${{ matrix.os }} / zoo ${{ matrix.zoo }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        zoo: [prefix, main]
        include:
          - zoo: prefix
            expect: reproduced
          - zoo: main
            expect: clean
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          ref=main; [ "${{ matrix.zoo }}" = prefix ] && ref="$PREFIX_REF"
          bash .github/repro/install.sh "$ref"
      - name: Vision tower in fp16
        run: |
          set -o pipefail
          python -u .github/repro/gemma4_vision_tower_fp16.py \
            --model mlx-community/gemma-4-26b-a4b-it-4bit --expect "${{ matrix.expect }}" \
            --report report.json 2>&1 | tee repro.log
      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          if not os.path.exists("report.json"):
              print("no report"); raise SystemExit
          d = json.load(open("report.json"))
          f16 = d["mlx.core.float16"]
          print(f"### tower-26b / ${{ matrix.os }} / zoo ${{ matrix.zoo }}: reproduced = **{d['reproduced']}** "
                f"(expected ${{ matrix.expect }})")
          print(f"unsloth-zoo {d['unsloth_zoo']}, fix applied {d['pooler_fix_applied']}, device `{d['device']}`")
          print(f"\nfp16 tower non-finite {f16['tower']['nonfinite']}, soft-token non-finite "
                f"{f16['soft_tokens']['nonfinite']}, cosine vs fp32 {f16.get('cosine_vs_fp32')}")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tower-26b-${{ matrix.os }}-${{ matrix.zoo }}
          path: |
            report.json
            repro.log

  # Whole model, text and image prompts, as Unsloth Studio loads it. Only macos-26 gets through the
  # fp16 cast at load; macos-15 and the LoRA case hit the VM's GPU timeout there.
  e2e:
    name: e2e / macos-26 / ${{ matrix.case }} / zoo ${{ matrix.zoo }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: base-fp16, dtype: float16, zoo: prefix}
          - {case: base-fp16, dtype: float16, zoo: main}
          - {case: base-auto, dtype: auto, zoo: main}
    env:
      MODEL: ${{ inputs.model || 'mlx-community/gemma-4-e4b-it-4bit' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          ref=main; [ "${{ matrix.zoo }}" = prefix ] && ref="$PREFIX_REF"
          bash .github/repro/install.sh "$ref"
      - name: Download model
        run: python -c "from huggingface_hub import snapshot_download; print(snapshot_download('${MODEL}'))"
      - name: Reproduce
        run: |
          set -o pipefail
          python -u .github/repro/gemma4_vision_nan.py \
            --model "$MODEL" --dtype "${{ matrix.dtype }}" --report report.json 2>&1 | tee repro.log
      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          if not os.path.exists("report.json"):
              print("no report (script failed before writing it)"); raise SystemExit
          d = json.load(open("report.json"))
          print(f"### e2e / ${{ matrix.case }} / zoo ${{ matrix.zoo }}: reproduced = **{d['reproduced']}**")
          print(f"device `{d['device_info'].get('device_name')}`, loaded dtype `{d.get('loaded_dtype')}`, "
                f"fp32 pooler patch `{d.get('pooler_fp32_patch')}`, versions `{d['versions']}`")
          for r in d["results"]:
              print(f"\n- {'image' if r['image'] else 'text'}: broken={r['broken']} "
                    f"first-token logprobs={r['first_token_logprobs']}\n  `{r['output'][:200]!r}`")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.case }}-${{ matrix.zoo }}
          path: |
            report.json
            repro.log
